- id: '1738006347550'
  alias: Desk Screens
  description: Turns on monitors when distance is below 4 feet but not 0; turns off
    after 3 minutes of no motion or when distance is 0 and occupancy is clear
  triggers:
  - trigger: numeric_state
    entity_id: sensor.tze204_qasjif9e_ts0601_target_distance
    below: 4
    above: 0
    id: occupied
  - trigger: state
    entity_id: binary_sensor.tze204_qasjif9e_ts0601_occupancy
    to: 'off'
    id: no_motion
  - trigger: state
    entity_id: sensor.tze204_qasjif9e_ts0601_target_distance
    to:
    - '0'
    - '0.0'
    - '0.00'
    id: zero_distance
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.desk_occupancy
    id: timer_finished
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: occupied
      sequence:
      - target:
          entity_id:
          - light.7962e412dda528fbbffdbcf1ce3eed95
          - light.b06019ef8d2ef6b6cad017e877ad08ce
        action: light.turn_on
        data: {}
      - target:
          entity_id: timer.desk_occupancy
        action: timer.cancel
        data: {}
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: no_motion
        - condition: and
          conditions:
          - condition: trigger
            id: zero_distance
          - condition: state
            entity_id: binary_sensor.tze204_qasjif9e_ts0601_occupancy
            state: 'off'
      - condition: state
        entity_id: timer.desk_occupancy
        state: idle
      sequence:
      - target:
          entity_id: timer.desk_occupancy
        action: timer.start
        data: {}
    - conditions:
      - condition: trigger
        id: timer_finished
      sequence:
      - action: light.turn_off
        data: {}
  mode: single
