#     lambda: |-
#       it.print(0, 0, id(default_font), "Hello World!");

# Enable logging
logger:

api:
  encryption:
    key: !secret esphome_encryption_key

ota:
  - platform: esphome


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Wemos-S2 Fallback Hotspot"
    password: "tjXYxw8yKZtU"

captive_portal:

# Web server for local access
web_server:
  port: 80
  version: 3