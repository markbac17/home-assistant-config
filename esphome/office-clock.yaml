esphome:
  name: led-matrix-clock

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  fast_connect: true
  ap:
    ssid: "Office Clock Fallback"
    password: !secret api_password

logger:
api:
  encryption:
    key: !secret esphome_encryption_key

ota:
  - platform: esphome

web_server:
  port: 80

time:
  - platform: homeassistant
    id: ha_time

spi:
  clk_pin: D5
  mosi_pin: D7

globals:
  - id: display_mode
    type: std::string
    restore_value: no
    initial_value: '"time"'

  - id: text_y_offset
    type: int
    restore_value: no
    initial_value: '-7'

  - id: last_scroll_time
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: seq_item
    type: int
    restore_value: no
    initial_value: '0'

  - id: seq_phase
    type: int
    restore_value: no
    initial_value: '0'

  - id: seq_hold_start
    type: uint32_t
    restore_value: no
    initial_value: '0'

font:
  - file: "fonts/5x7.bdf"
    id: font_matrix
    size: 7

sensor:
  - platform: homeassistant
    id: tsla_price
    entity_id: sensor.yahoofinance_tsla
    accuracy_decimals: 2
  - platform: homeassistant
    id: pltr_price
    entity_id: sensor.yahoofinance_pltr
    accuracy_decimals: 2

display:
  - platform: max7219digit
    id: my_matrix
    cs_pin: D8
    num_chips: 4
    scroll_enable: false
    update_interval: 16ms
    lambda: |-
      const int ENTER_START_Y = -7;
      const int VISIBLE_Y     = 0;
      const int EXIT_END_Y    = 8;
      const uint32_t HOLD_MS  = 10000;

      const uint32_t now = millis();
      uint32_t speed_ms = (uint32_t) id(scroll_speed).state;
      if (speed_ms < 10) speed_ms = 10;

      it.clear();

      bool step = false;
      if (now - id(last_scroll_time) >= speed_ms) {
        id(last_scroll_time) = now;
        step = true;
      }

      if (id(display_mode) == "sequence") {
        char msg[20];
        int x_offset = 0;

        // 1. Prepare the string
        if (id(seq_item) == 0) {
          if (id(tsla_price).has_state()) {
            snprintf(msg, sizeof(msg), "T %.2f", id(tsla_price).state);
          } else {
            snprintf(msg, sizeof(msg), "T ---");
          }
        } else if (id(seq_item) == 1) {
          if (id(pltr_price).has_state()) {
            snprintf(msg, sizeof(msg), "P %.2f", id(pltr_price).state);
          } else {
            snprintf(msg, sizeof(msg), "P ---");
          }
        } else {
          snprintf(msg, sizeof(msg), "%%H:%%M");
        }

        // 2. Horizontal Scroll Logic (only during 'hold' phase)
        if (id(seq_phase) == 1 && id(seq_item) < 2) {
           float progress = (float)(now - id(seq_hold_start)) / HOLD_MS;
           x_offset = (int)(progress * -18.0f); 
        } else if (id(seq_item) == 2) {
           x_offset = 5;
        }

        // 3. Draw the text
        if (id(seq_item) == 2) {
          it.strftime(x_offset, id(text_y_offset), id(font_matrix), "%H:%M", id(ha_time).now());
        } else {
          it.print(x_offset, id(text_y_offset), id(font_matrix), msg);
        }

        // 4. State Machine
        if (id(seq_phase) == 0) {
          if (step) id(text_y_offset)++;
          if (id(text_y_offset) >= VISIBLE_Y) {
            id(text_y_offset) = VISIBLE_Y;
            id(seq_phase) = 1;
            id(seq_hold_start) = now;
          }
        } else if (id(seq_phase) == 1) {
          if (now - id(seq_hold_start) >= HOLD_MS) {
            id(seq_phase) = 2;
          }
        } else {
          if (step) id(text_y_offset)++;
          if (id(text_y_offset) > EXIT_END_Y) {
            id(seq_item)++;
            if (id(seq_item) > 2) {
              id(display_mode) = "time";
              id(seq_item) = 0;
              id(seq_phase) = 0;
              id(text_y_offset) = ENTER_START_Y;
            } else {
              id(seq_phase) = 0;
              id(text_y_offset) = ENTER_START_Y;
            }
          }
        }

      } else if (id(display_mode) == "text") {
        it.print(0, id(text_y_offset), id(font_matrix), id(display_text).state.c_str());
        if (step) id(text_y_offset)++;
        if (id(text_y_offset) > 8) id(text_y_offset) = -7;
      } else {
        it.strftime(5, 0, id(font_matrix), "%H:%M", id(ha_time).now());
      }

number:
  - platform: template
    id: matrix_brightness
    name: "LED Matrix Brightness"
    icon: "mdi:brightness-7"
    min_value: 0
    max_value: 15
    step: 1
    optimistic: true
    initial_value: 10
    restore_value: true
    set_action:
      - lambda: |-
          id(my_matrix).set_intensity((uint8_t)x);
          id(my_matrix).setup(); 
    entity_category: config

  - platform: template
    id: scroll_speed
    name: "Text Scroll Speed"
    icon: "mdi:speedometer"
    min_value: 50
    max_value: 500
    step: 10
    initial_value: 150
    optimistic: true
    restore_value: true
    unit_of_measurement: "ms"

text_sensor:
  - platform: homeassistant
    id: display_text
    entity_id: input_text.led_matrix_text
    on_value:
      then:
        - lambda: |-
            id(display_mode) = "text";
            id(text_y_offset) = -7;
            id(last_scroll_time) = millis();

button:
  - platform: template
    id: show_time
    name: "LED Matrix Show Time"
    on_press:
      then:
        - lambda: |-
            id(display_mode) = "time";

  - platform: template
    id: show_text
    name: "LED Matrix Show Text"
    on_press:
      then:
        - lambda: |-
            id(display_mode) = "sequence";
            id(seq_item) = 0;
            id(seq_phase) = 0;
            id(text_y_offset) = -7;
            id(last_scroll_time) = millis();
            id(seq_hold_start) = 0;