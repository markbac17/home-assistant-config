substitutions:
  name: "sense-sierra"
  friendly_name: "Sense Sierra"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: false
  project:
    name: esphome.BlueVue
    version: "1.0"

esp8266:
  board: d1_mini

logger:
  baud_rate: 0

uart:
  - id: UART_senseair
    rx_pin: D4
    tx_pin: D3 
    baud_rate: 9600
  - id: UART_pms
    rx_pin: D5
    tx_pin: D6
    baud_rate: 9600

sensor:
  - platform: pmsx003
    type: PMS5003T
    uart_id: UART_pms
    pm_2_5:
      name: "Bedroom PM"
    temperature:
      name: "Bedroom PM Temperature"
    humidity:
      name: "Bedroom PM humidity"
    update_interval: 30000ms

  - platform: dallas_temp
    address: 0x4801157173e9ff28
    name: "Bedroom DS Temperature"
    unit_of_measurement: °F
    accuracy_decimals: 1
    update_interval: 5s

  - platform: senseair
    uart_id: UART_senseair
    co2:
      id: co2
      name: "Sierra CO2 Value"
    update_interval: 60s

#one_wire:
#  - platform: gpio
#    pin: D7

one_wire:
  - platform: gpio
    pin: GPIO13

