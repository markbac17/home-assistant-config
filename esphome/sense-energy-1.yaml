esphome:
  name: sense-energy-1

esp8266:
  board: esp01_1m

i2c:
  sda: GPIO0
  scl: GPIO2
  scan: true
  id: bus_a

ads1115:
 - address: 0x48
   continuous_mode: on

sensor:
  - platform: ads1115
    multiplexer: 'A0_A1'
    gain: 2.048
    name: "ADS1115_A0_A1"
    id: adc_sensor_1
  - platform: ads1115  
    multiplexer: 'A2_A3'
    gain: 2.048
    name: "ADS1115_A2_A3"
    id: adc_sensor_2

  - platform: ct_clamp
    sensor: adc_sensor_1
    name: "Measured Current 1"
    update_interval: 5s
    filters:
      - calibrate_linear:
          # Measured value of 0 maps to 0A
          - 0.1 -> 0
          # Known load: 4.0A
          # Value shown in logs: 0.1333A
          - 1.8 -> 11.8
  - platform: ct_clamp
    sensor: adc_sensor_2
    name: "Measured Current 2"
    update_interval: 5s
    filters:
      - calibrate_linear:
          # Measured value of 0 maps to 0A
          - 0.1 -> 0
          # Known load: 4.0A
          # Value shown in logs: 0.1333A
          - 1.8 -> 11.8

# Enable logging
