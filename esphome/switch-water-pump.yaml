substitutions:
  name: "switch-water-pump"
  friendly_name: "Switch Water Pump"
  device_description: "Hydroponic irrigation pump on ESP-01 Relay v4"
  relay_pin: GPIO0
  status_led_pin: GPIO2
  relay_inverted: "true"          # Flip to "false" if your relay logic is reversed
  pump_default_seconds: "120"     # Default run for the 'Run Now' button (seconds)
  auto_run_seconds: "120"         # How long to run each cycle (seconds)
  auto_repeat_minutes: "60"       # How often to repeat when Auto Mode is enabled (minutes)

esp8266:
  board: esp01_1m

logger:
  level: INFO

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "${device_description}"
  name_add_mac_suffix: false
  project:
    name: esphome.BlueVue
    version: "2.0"
  on_boot:
    priority: 800
    then:
      - switch.turn_off: pump_relay

api:
  encryption:
    key: !secret esphome_encryption_key
  services:
    - service: run_pump_for
      variables:
        seconds: int
      then:
        - if:
            condition:
              lambda: 'return (seconds > 0);'
            then:
              - logger.log:
                  format: "Running pump for %d second(s) via API service"
                  args: [ 'seconds' ]
              - script.execute:
                  id: irrigate_for
                  seconds: !lambda 'return seconds;'

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  ap:
    ssid: "Switch-Fallback"
    password: !secret api_password
  manual_ip:
    static_ip: 192.168.1.120
    gateway: 192.168.1.1
    subnet: 255.255.255.0

captive_portal:

ota:
  platform: esphome
  password: !secret ota_password

safe_mode:

web_server:
  port: 80
  version: 3

time:
  - platform: sntp
    id: sntp_time
    on_time_sync:
      then:
        - logger.log: "Time synchronized successfully"
    on_time:
      - seconds: 0
        minutes: /${auto_repeat_minutes}
        then:
          - if:
              condition:
                switch.is_on: auto_mode
              then:
                - logger.log: "Auto Mode: starting scheduled irrigation"
                - script.execute:
                    id: irrigate_for
                    seconds: !lambda 'return (int) id(cfg_run_seconds).state;'

status_led:
  pin:
    number: ${status_led_pin}
    inverted: true

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi RSSI"
    update_interval: 60s

  - platform: uptime
    name: "${friendly_name} Uptime"

  - platform: uptime
    type: seconds
    id: uptime_s
    internal: true

  - platform: template
    name: "${friendly_name} Last Run Duration"
    unit_of_measurement: s
    icon: mdi:timer
    lambda: |-
      static int last_duration = 0;
      if (id(pump_relay).state) {
        last_duration = (int) id(cfg_run_seconds).state;
      }
      return last_duration;
    update_interval: 10s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP"
    ssid:
      name: "${friendly_name} SSID"
    bssid:
      name: "${friendly_name} BSSID"

switch:
  - platform: gpio
    id: pump_relay
    name: "${friendly_name}"
    pin:
      number: ${relay_pin}
      inverted: ${relay_inverted}
      mode: OUTPUT
    restore_mode: ALWAYS_OFF
    icon: mdi:water-pump

  - platform: template
    id: auto_mode
    name: "${friendly_name} Auto Mode"
    icon: mdi:autorenew
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - logger.log: "Auto Mode enabled"
    turn_off_action:
      - logger.log: "Auto Mode disabled"

number:
  - platform: template
    id: cfg_run_seconds
    name: "${friendly_name} Run Seconds"
    min_value: 10
    max_value: 900
    step: 5
    optimistic: true
    restore_value: true
    initial_value: ${auto_run_seconds}
    icon: mdi:timer
    unit_of_measurement: s

  - platform: template
    id: cfg_repeat_minutes
    name: "${friendly_name} Repeat Every (Minutes)"
    min_value: 5
    max_value: 1440
    step: 5
    optimistic: true
    restore_value: true
    initial_value: ${auto_repeat_minutes}
    icon: mdi:update
    unit_of_measurement: min

button:
  - platform: template
    name: "${friendly_name} Run Now"
    icon: mdi:play
    on_press:
      then:
        - logger.log: "Manual Run Now pressed"
        - script.execute:
            id: irrigate_for
            seconds: !lambda 'return (int) id(cfg_run_seconds).state;'

  - platform: restart
    name: "${friendly_name} Restart"

script:
  - id: irrigate_for
    parameters:
      seconds: int
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return seconds > 0;'
          then:
            - logger.log:
                format: "Starting irrigation for %d second(s)"
                args: [ 'seconds' ]
            - switch.turn_on: pump_relay
            - delay: !lambda |-
                return (uint32_t) (seconds * 1000);
            - switch.turn_off: pump_relay
            - logger.log: "Irrigation complete"