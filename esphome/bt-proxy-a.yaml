substitutions:
  name: "bt-proxy-a"
  friendly_name: "BT Proxy A"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: false
  project:
    name: esphome.bluetooth-proxy
    version: "1.0"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
      CONFIG_ESP32_DEFAULT_CPU_FREQ_160: y

logger:
  level: INFO

# Optimized BLE settings
esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 1100ms
    window: 1100ms
    duration: 5min

bluetooth_proxy:
  active: true

# Essential sensors
sensor:
  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"

button:
  - platform: restart
    name: "Restart"
  - platform: safe_mode
    name: "Safe Mode Boot"
    entity_category: diagnostic

time:
  - platform: sntp
    id: sntp_time

api:
  encryption:
    key: !secret esphome_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  ap:
    ssid: "BT-Proxy-A Fallback"
    password: !secret api_password

captive_portal:

web_server:
  port: 80
  version: 3
  local: true