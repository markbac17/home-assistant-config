esphome:
  name: sense-presence
  friendly_name: Sense Presence
  project:
    name: BlueVue.esphome
    version: "1.0"

esp8266:
  board: esp01_1m

logger:
  baud_rate: 0

api:
  encryption:
    key: !secret esphome_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light
  fast_connect: true
  min_auth_mode: WPA2   # Silences WPA warning; upgrade to WPA3 if possible
  ap:
    ssid: "Sense-Presence Fallback Hotspot"
    password: "QoeoUVvsLAdg"

captive_portal:

web_server:
  port: 80
  version: 3

safe_mode:

time:
  - platform: homeassistant
    id: homeassistant_time

uart:
  tx_pin: TX     # GPIO1
  rx_pin: RX     # GPIO3
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410: {}       # Required hub; config via numbers below

switch:
  - platform: ld2410
    engineering_mode:
      name: Engineering Mode

binary_sensor:
  - platform: ld2410
    has_target:
      name: "Presence"
      id: presence_sensor
    has_moving_target:
      name: "Moving Target"
      id: moving_target_sensor
    has_still_target:
      name: "Still Target"
      id: still_target_sensor

sensor:
  - platform: ld2410
    moving_distance:
      name: Moving Distance
    still_distance:
      name: Still Distance
    moving_energy:
      name: Moving Energy
    still_energy:
      name: Still Energy
    detection_distance:
      name: Detection Distance
    # Optional if your LD2410 exposes it
    light:
      name: Light Level

  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Uptime
    update_interval: 60s
    entity_category: diagnostic

# Tunables – appear as sliders in HA after install
# Set your values (e.g. timeout=15, max gates=3 for 6ft range) in HA → Numbers tab
number:
  - platform: ld2410
    timeout:
      name: Presence Timeout
      icon: "mdi:timer"
      unit_of_measurement: s

    max_move_distance_gate:
      name: Max Move Distance Gate

    max_still_distance_gate:
      name: Max Still Distance Gate

  - platform: ld2410
    g0:
      move_threshold:
        name: G0 Move Threshold
      still_threshold:
        name: G0 Still Threshold

    g1:
      move_threshold:
        name: G1 Move Threshold
      still_threshold:
        name: G1 Still Threshold

    g2:
      move_threshold:
        name: G2 Move Threshold
      still_threshold:
        name: G2 Still Threshold

    g3:
      move_threshold:
        name: G3 Move Threshold
      still_threshold:
        name: G3 Still Threshold

    g4:
      move_threshold:
        name: G4 Move Threshold
      still_threshold:
        name: G4 Still Threshold

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic