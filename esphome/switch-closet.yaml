substitutions:
  name: "switch-closet"
  friendly_name: "Switch Closet"

packages:
  device_base: !include modules/device_base.yaml
  wifi: !include modules/wifi.yaml

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: false
  project:
    name: esphome.BlueVue
    version: "2.0"

esp8266:
  board: esp01_1m

logger:
  level: INFO
  baud_rate: 0

api:
  encryption:
    key: !secret esphome_encryption_key

ota:
  platform: esphome
  password: "034cdb2731a4a1811f49068fd0c4a9e5"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  ap:
    ssid: "${friendly_name}-Fallback"
    password: !secret api_password

captive_portal:

web_server:
  port: 80
  version: 3

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Closet light"
    on_press:
      - switch.toggle: relay

switch:
  - platform: gpio
    name: "Closet light"
    icon: "mdi:light-recessed"
    pin: GPIO12
    id: relay
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - switch.turn_off: green_led
    on_turn_off:
      - switch.turn_on: green_led
  - platform: gpio
    name: Green LED
    id: green_led
    pin:
      number: GPIO13
      inverted: false
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    entity_category: diagnostic
    update_interval: 60s
  - platform: uptime
    name: "${friendly_name} Uptime"
    entity_category: diagnostic
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
      entity_category: diagnostic

button:
  - platform: restart
    name: "${friendly_name} Restart"
    entity_category: diagnostic