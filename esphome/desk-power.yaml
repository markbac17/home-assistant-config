substitutions:
  name: "switch-outdoor"
  friendly_name: "Switch Outdoor"
  device_description: "Switch with power monitoring"
  board: esp32dev
  project_name: "esphome.BlueVue"
  project_version: "3.0"
  # Standard values for Wyze Outdoor Plug
  current_res: "0.001"
  voltage_div: "770" 

packages:
  base: !include modules/base.yaml
  platform: !include modules/platform/esp32_espidf.yaml

# Enable logging
logger:
  level: INFO

esp32_ble_tracker:
  scan_parameters:
    active: true

time:
 - platform: sntp
   id: sntp_time
   timezone: "America/New_York"
   servers:
     - pool.ntp.org
     - time.google.com

bluetooth_proxy:
  active: true

switch:
  - platform: gpio
    name: "${friendly_name} Left"
    pin:
      number: GPIO15
      inverted: false
      ignore_strapping_warning: true  # Suppresses warning
    id: relay1
    on_turn_on:
      - light.turn_on: relay1_led
    on_turn_off:
      - light.turn_off: relay1_led
    restore_mode: ALWAYS_OFF
  - platform: gpio
    name: "${friendly_name} Right"
    pin:
      number: GPIO32
      inverted: false
    id: relay2
    on_turn_on:
      - light.turn_on: relay2_led
    on_turn_off:
      - light.turn_off: relay2_led
    restore_mode: ALWAYS_OFF
  - platform: restart
    name: "${friendly_name} Restart"

output:
  - platform: gpio
    pin: GPIO19
    inverted: true
    id: relay1_led_gpio
  - platform: gpio
    pin: GPIO16
    inverted: true
    id: relay2_led_gpio

light:
  - platform: binary
    name: "Relay1 LED"
    id: relay1_led
    internal: true    
    output: relay1_led_gpio
  - platform: binary
    name: "Relay2 LED"
    id: relay2_led
    internal: true
    output: relay2_led_gpio

sensor:
  - platform: adc
    pin: GPIO34
    name: "${friendly_name} LUX (Raw Voltage)"
    id: lux_sensor
    update_interval: 30s
    attenuation: auto
  - platform: hlw8012
    sel_pin:
      number: GPIO25
      inverted: true
    cf_pin: GPIO27
    cf1_pin: GPIO26
    current_resistor: ${current_res}
    voltage_divider: ${voltage_div}
    change_mode_every: 3
    update_interval: 10s    
    current:
      name: "${friendly_name} Amps"
      unit_of_measurement: A
      accuracy_decimals: 2
    voltage:
      name: "${friendly_name} Volts"
      unit_of_measurement: V
      accuracy_decimals: 1
    power:
      name: "${friendly_name} Power"
      id: my_power
      unit_of_measurement: W
      accuracy_decimals: 0    
      filters:
        - throttle_average: 15s
    energy:
      name: "${friendly_name} Energy"
      filters:
        - throttle_average: 15s
  - platform: total_daily_energy
    name: '${friendly_name} Daily Energy'
    power_id: my_power
    unit_of_measurement: 'kWh'
    state_class: total_increasing
    device_class: energy
    accuracy_decimals: 1
    filters:
      - multiply: 0.001

binary_sensor:
  - platform: gpio
    internal: true
    pin:
      number: GPIO18
      mode: INPUT_PULLDOWN
      inverted: true
    name: "${friendly_name} Button1"
    on_press:
      - switch.toggle: relay1
  - platform: gpio
    internal: true
    pin:
      number: GPIO17
      mode: INPUT_PULLDOWN
      inverted: true
    name: "${friendly_name} Button2"
    on_press:
      - switch.toggle: relay2
  - platform: template
    name: "${friendly_name} Daylight"
    lambda: |-
      if (id(lux_sensor).state > 0.2) {
        return true;
      } else {
        return false;
      }

status_led:
  pin:
    number: GPIO5
    inverted: true
    ignore_strapping_warning: true  # Suppresses warning