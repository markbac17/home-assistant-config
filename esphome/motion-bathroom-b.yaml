esphome:
  name: sense-presence
  friendly_name: Sense Presence

esp8266:
  board: esp01_1m

logger:
  baud_rate: 0

# Enable Home Assistant API
api:
  encryption:
    key: "/2tQDo7JWmX94GuKFXphsvXiB7W7faHPfateOOjYwsY="


uart:
  tx_pin: TX # GPIO1
  rx_pin: RX # GPIO3
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  # If using dedicated UART:
  # uart_id: ld2410_uart
  # If using default UART0 (as configured above):
  # No uart_id needed, but be aware of potential conflicts.

binary_sensor:
  - platform: ld2410
    has_target:
      name: "Presence"
      id: presence_sensor
    has_moving_target:
      name: "Moving Target"
      id: moving_target_sensor
    has_still_target:
      name: "Still Target"
      id: still_target_sensor

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Sense-Presence Fallback Hotspot"
    password: "QoeoUVvsLAdg"

captive_portal:

# Web server for local access
web_server:
  port: 80
  version: 3