substitutions:
  name: "matrix-ring"
  friendly_name: "Matrix Ring"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: BlueVue.esphome
    version: "1.0"

esp8266:
  board: esp01_1m

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  ap:
    ssid: "LED Ring Fallback"
    password: !secret api_password

logger:
  # Disable UART logging since ESP-01 uses GPIO1/3 for TX/RX
  baud_rate: 0

api:
  encryption:
    key: !secret esphome_encryption_key

ota:
  - platform: esphome

web_server:
  port: 80

# WS2812B on GPIO2 (the only safe GPIO on ESP-01)
light:
 - platform: neopixelbus
   type: GRB
   variant: WS2812
   pin: GPIO2
   num_leds: 24
   name: "LED Ring"
   id: led_ring
   effects:
     - addressable_rainbow:
         name: Rainbow
         speed: 10
         width: 50
     - addressable_color_wipe:
         name: Color Wipe
     - addressable_scan:
         name: Scan
     - addressable_twinkle:
         name: Twinkle
     - addressable_random_twinkle:
         name: Random Twinkle
     - addressable_fireworks:
         name: Fireworks
     - addressable_flicker:
         name: Flicker


# Optional: Individual LED control
number:
 - platform: template
   name: "LED Ring Brightness"
   id: ring_brightness
   icon: "mdi:brightness-6"
   min_value: 0
   max_value: 100
   step: 5
   initial_value: 80
   optimistic: true
   restore_value: true
   unit_of_measurement: "%"
   set_action:
     - light.turn_on:
         id: led_ring
         brightness: !lambda 'return x / 100.0;'


# Optional: Quick color presets
button:
 - platform: template
   name: "LED Ring Red"
   on_press:
     - light.turn_on:
         id: led_ring
         red: 100%
         green: 0%
         blue: 0%


 - platform: template
   name: "LED Ring Green"
   on_press:
     - light.turn_on:
         id: led_ring
         red: 0%
         green: 100%
         blue: 0%


 - platform: template
   name: "LED Ring Blue"
   on_press:
     - light.turn_on:
         id: led_ring
         red: 0%
         green: 0%
         blue: 100%


 - platform: template
   name: "LED Ring White"
   on_press:
     - light.turn_on:
         id: led_ring
         red: 100%
         green: 100%
         blue: 100%


 - platform: template
   name: "LED Ring Off"
   on_press:
     - light.turn_off:
         id: led_ring



