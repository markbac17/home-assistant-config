substitutions:
  name: "switch-dining-display"
  friendly_name: "Switch Dining Display"
  device_description: "Shelly 1PM switch controlling dining room display"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "${device_description}"
  name_add_mac_suffix: false
  project:
    name: esphome.BlueVue
    version: "1.0"

esp8266:
  board: esp01_1m
  restore_from_flash: true

# Enable logging with reduced severity for better performance
logger:
  level: INFO
  baud_rate: 115200

# API configuration
api:
  encryption:
    key: !secret esphome_encryption_key
  reboot_timeout: 15min

# WiFi configuration with improved reliability
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  ap:
    ssid: "Switch-Dining-Fallback"
    password: !secret api_password

captive_portal:

# OTA updates
ota:
  - platform: esphome

# Safe mode component
safe_mode:

# Status LED for device status indication
status_led:
  pin:
    number: GPIO0
    inverted: true

# Main relay switch
switch:
  - platform: gpio
    name: "Display Dining"
    pin: GPIO15
    id: shelly_relay
    restore_mode: RESTORE_DEFAULT_OFF

# Physical button
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
    name: "Display Dining Button"
    id: physical_button
    internal: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      then:
        - switch.toggle: shelly_relay

# Sensors
sensor:
  # WiFi Signal Strength - reduced update frequency for efficiency
  - platform: wifi_signal
    name: "Display Dining WiFi Signal"
    device_class: signal_strength
    state_class: measurement
    update_interval: 300s  # 5 minutes instead of 1 minute
    filters:
      - sliding_window_moving_average:
          window_size: 3
          send_every: 3

  # Power monitoring with improved calibration
  - platform: hlw8012
    cf_pin: GPIO5
    cf1_pin: GPIO13  # Required for compilation even if not used
    sel_pin: GPIO14  # Required for compilation even if not used
    voltage_divider: 1684  # Shelly 1PM default
    current_resistor: 0.001  # Shelly 1PM default
    change_mode_every: 8
    update_interval: 10s
    id: hlw8012_sensor
    
    power:
      name: "Display Dining Power"
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      accuracy_decimals: 1
      filters:
        # Improved calibration curve
        - calibrate_linear:
            - 0.0 -> 0.0
            - 110.33 -> 20.62
            - 131.02 -> 24.32
            - 341.34 -> 62.08
            - 2975.51 -> 535.7
            - 5561.42 -> 1000.0
            - 9612.66 -> 1720.0
            - 14891.35 -> 2679.0
        # Filter noise below 2W
        - lambda: |-
            if (x < 2.0) return 0.0;
            return x;
        # Throttle updates to reduce network traffic
        - throttle: 5s
        - delta: 1.0  # Only send updates if change > 1W

    energy:
      name: "Display Dining Energy"
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
      accuracy_decimals: 3
      filters:
        - multiply: 0.001  # Convert Wh to kWh

  # Uptime sensor for monitoring
  - platform: uptime
    name: "Display Dining Uptime"
    device_class: duration
    state_class: total_increasing
    entity_category: diagnostic
    update_interval: 300s

# Text sensors for diagnostics
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Display Dining IP Address"
      entity_category: diagnostic
    mac_address:
      name: "Display Dining MAC Address"
      entity_category: diagnostic

# Interval for periodic updates
interval:
  - interval: 60s
    then:
      - component.update: hlw8012_sensor