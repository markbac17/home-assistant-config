substitutions:
  name: "matrix"
  friendly_name: "Matrix"
  device_description: "LED Matrix display"
  board: esp32-s3-devkitc-1
  project_name: "esphome.BlueVue"
  project_version: "3.0"
  ip_address: "10.10.10.195"

globals:
  - id: matrix_display_on
    type: bool
    restore_value: yes
    initial_value: 'true'  # Starts ON by default

packages:
  network: !include modules/network_defaults.yaml
  base: !include modules/base.yaml
  platform: !include modules/platform/esp32_espidf.yaml

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

font:
  - file: fonts/6x10-rounded.bdf
    id: default_font
  - file: fonts/5x8.bdf
    id: small_font

color:
  - id: my_red
    hex: FF3340
  - id: my_yellow
    hex: FFFF00
  - id: my_green
    hex: 44CE36
  - id: my_blue
    hex: 3FF0FF
  - id: my_orange
    hex: DE4736
  - id: my_white
    hex: FFFFFF
  - id: my_purple
    hex: 800080

display:
  - platform: hub75
    id: matrix_hub75_display
    board: adafruit-matrix-portal-s3
    panel_width: 64
    panel_height: 32
    bit_depth: 8
    brightness: 80  # Try lowering to 70-80 if flicker persists (reduces power draw)
    latch_blanking: 3  # Start with 2-4; common fix for ghosting/flicker
    clock_phase: true  # Toggle this (true/false); fixes phase mismatches on some chips
#    min_refresh_rate: 120  # Increase from default (~60-100 Hz) for smoother output
    double_buffer: true  # Prevents tearing (can appear as flicker during updates)
    # clock_speed: 10MHZ  # Uncomment and try lower values (8MHZ/10MHZ) if above doesn't help
    lambda: |-
      if (!id(matrix_display_on)) {
        it.fill(COLOR_OFF);  // Completely black when switched off
        return;
      }

      it.fill(COLOR_OFF); // Clear the display (your original line)

      // Safely parse the page number from Home Assistant input_number (state is string)
      int page_index = 0; // Default page
      auto page_opt = parse_number<float>(id(matrix_current_page_number).state);
      if (page_opt.has_value()) {
        float page_val = page_opt.value();
        if (!std::isnan(page_val) && !std::isinf(page_val)) {
          page_index = static_cast<int>(round(page_val));
          // Clamp to valid range (0-3 based on your cases)
          if (page_index < 0) page_index = 0;
          if (page_index > 3) page_index = 3;
        }
      }

      // ... (the rest of your existing switch(page_index) { ... } code unchanged)

      switch (page_index) {
        case 0: {
          // --- Page 0: Temperatures and Energy ---
          if (!isnan(id(outdoor_temperature).state)) {
            int rounded_temp = round(id(outdoor_temperature).state);
            it.print(0, 1, id(small_font), id(my_red), "D");
            it.printf(7, 0, id(default_font), id(my_red), "%d", rounded_temp);
          }
          if (!isnan(id(office_temperature).state)) {
            int rounded_temp2 = round(id(office_temperature).state);
            it.print(23, 1, id(small_font), id(my_blue), "O");
            it.printf(30, 0, id(default_font), id(my_blue), "%d", rounded_temp2);
          }
          if (!isnan(id(bathroom_temperature).state)) {
            int rounded_temp3 = round(id(bathroom_temperature).state);
            it.print(45, 1, id(small_font), id(my_green), "L");
            it.printf(52, 0, id(default_font), id(my_green), "%d", rounded_temp3);
          }
          if (!isnan(id(living_temperature).state)) {
            int rounded_temp4 = round(id(living_temperature).state);
            it.print(0, 10, id(small_font), id(my_red), "L");
            it.printf(7, 9, id(default_font), id(my_red), "%d", rounded_temp4);
          }
          if (!isnan(id(bedroom_temperature).state)) {
            int rounded_temp5 = round(id(bedroom_temperature).state);
            it.print(23, 10, id(small_font), id(my_blue), "S");
            it.printf(30, 9, id(default_font), id(my_blue), "%d", rounded_temp5);
          }
          if (!isnan(id(bathroom_2_temperature).state)) {
            int rounded_temp6 = round(id(bathroom_2_temperature).state);
            it.print(45, 10, id(small_font), id(my_green), "B");
            it.printf(52, 9, id(default_font), id(my_green), "%d", rounded_temp6);
          }
          if (!isnan(id(energy).state)) {
            int rounded_energy = round(id(energy).state);
            it.printf(0, 24, id(default_font), id(my_yellow), "%dW", rounded_energy);
          }
          if (id(homeassistant_time).now().is_valid()) {
            it.strftime(38, 25, id(small_font), id(my_yellow), "%H:%M", id(homeassistant_time).now());
          }
          break;
        }

        case 1: {
          // --- Page 1: Stocks ---
          if (!isnan(id(tsla).state)) {
            int val = round(id(tsla).state);
            it.print(1, 14, id(default_font), id(my_blue), "TSLA");
            it.printf(30, 14, id(default_font), id(my_blue), "%d", val);
          }
          if (!isnan(id(pltr).state)) {
            int val = round(id(pltr).state);
            it.print(1, 24, id(default_font), id(my_green), "PLTR");
            it.printf(30, 24, id(default_font), id(my_green), "%d", val);
          }
          break;
        }

        case 2: {
          // --- Page 2: Text Message ---
          if (id(ha_matrix_text).state.length() > 0) {
            it.print(1, 7, id(small_font), id(my_orange), id(ha_matrix_text).state.substr(0, 20).c_str());
            if (id(ha_matrix_text).state.length() > 20) {
              it.print(1, 17, id(small_font), id(my_orange), id(ha_matrix_text).state.substr(20, 20).c_str());
            }
          } else {
            it.print(12, 7, id(default_font), id(my_orange), "PAGE 2");
            it.print(2, 17, id(small_font), id(my_white), "No HA Text");
          }
          break;
        }

        case 3: {
          // --- Page 3: Energy and Presence ---
          it.print(2, 1, id(default_font), id(my_green), "Presence");

          if (!isnan(id(energy).state)) {
            it.printf(2, 22, id(small_font), id(my_yellow), "Energy: %dW", static_cast<int>(round(id(energy).state)));
          } else {
            it.print(2, 22, id(small_font), id(my_yellow), "Energy: N/A");
          }
          break;
        }

        default:
          it.print(5, 12, id(small_font), id(my_red), "Invalid Page!");
          break;
      }


switch:
  - platform: template
    name: "Matrix Display Power"
    icon: "mdi:matrix"
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - globals.set:
          id: matrix_display_on
          value: 'true'
      - switch.template.publish:
          id: matrix_power_switch
          state: ON
    turn_off_action:
      - globals.set:
          id: matrix_display_on
          value: 'false'
      - switch.template.publish:
          id: matrix_power_switch
          state: OFF
    lambda: >-
      return id(matrix_display_on);
    id: matrix_power_switch  # Important: give it an ID

time:
  - platform: homeassistant
    id: homeassistant_time

sensor:
  - platform: homeassistant
    name: "Office Temperature"
    id: office_temperature
    entity_id: sensor.sense_office_pm_temperature
    internal: true
  - platform: homeassistant
    name: "Bathroom Temperature"
    id: bathroom_temperature
    entity_id: sensor.bathroom_temperature
    internal: true
  - platform: homeassistant
    name: "Outdoor Temperature"
    id: outdoor_temperature
    entity_id: sensor.khpn_temperature
    internal: true
  - platform: homeassistant
    name: "Bedroom Temperature"
    id: bedroom_temperature
    entity_id: sensor.sense_b_temp
    internal: true
  - platform: homeassistant
    name: "Secondary Bathroom Temperature"
    id: bathroom_2_temperature
    entity_id: sensor.sense_a_temperature
    internal: true
  - platform: homeassistant
    name: "Living Room Temperature"
    id: living_temperature
    entity_id: sensor.home_current_temperature
    internal: true
  - platform: homeassistant
    name: "Energy Consumption"
    id: energy
    entity_id: sensor.realtime_consumption
    internal: true
  - platform: homeassistant
    name: "Tesla"
    id: tsla
    entity_id: sensor.yahoofinance_tsla
    internal: true
  - platform: homeassistant
    name: "Palantir"
    id: pltr
    entity_id: sensor.yahoofinance_pltr
    internal: true

text_sensor:
  - platform: homeassistant
    id: ha_matrix_text
    entity_id: input_text.matrix_text
  - platform: homeassistant  # Fixed: this should be under number, not text_sensor
    id: matrix_current_page_number
    entity_id: input_number.matrix_display_page
    internal: true