esphome:
  name: bt-proxy-b
  friendly_name: BT Proxy B

packages:
  device_base: !include modules/device_base.yaml
  wifi: !include modules/wifi.yaml

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

uart:
  id: uart_2
  rx_pin: 21
  tx_pin: 20
  baud_rate: 9600
#  baud_rate: 115200
  debug:

display:
  - platform: nextion
    id: nextion1
    uart_id: uart_2
    update_interval: 10s
    lambda: |-
      it.set_component_text("t0", "Test");


logger:

ota:
  - platform: esphome
    password: !secret ota_password

