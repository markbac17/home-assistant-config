esphome:
  name: switch-air-filter

esp8266:
  board: esp8285

# Enable logging
logger:

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Speaker"
    on_press:
      - switch.toggle: relay

switch:
  - platform: gpio
    name: "Speaker"
    icon: mdi:speaker
    pin: GPIO12
    id: relay

status_led:
  pin:
    number: GPIO13
    inverted: yes

button:
- platform: safe_mode
  name: Safe Mode Boot
  entity_category: diagnostic

api:
  encryption:
    key: !secret esphome_encryption_key

ota:
  - platform: esphome
    password: "43f060a00945a45e624af156974db2a6"
#ota:
#  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Switch Speaker Fallback Hotspot"
    password: !secret api_password

captive_portal:

web_server:
  port: 80