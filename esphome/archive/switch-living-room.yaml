  wifi: !include modules/wifi.yaml

esp8266:
  board: esp01_1m

uart:
  rx_pin: GPIO3
  tx_pin: GPIO1
  baud_rate: 115200

logger:
  baud_rate: 0
  level: VERBOSE

tuya:

