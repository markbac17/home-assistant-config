substitutions:
  name: "ir-receiver"
  friendly_name: "IR Receiver"

packages:
  device_base: !include modules/device_base.yaml
  wifi: !include modules/wifi.yaml

esp8266:
  board: esp01_1m

remote_receiver:
  pin:
    number: GPIO03
    inverted: true
  dump:
    - lg

binary_sensor: !include "modules/ir_codes.yaml"

logger:

ota:
  - platform: esphome
    password: !secret ota_password