substitutions:
  name: "display_led"
  friendly_name: "Display LED"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: BlueVue.esphome
    version: "1.0"

esp8266:
  board: d1_mini

logger:

light:
  - platform: neopixelbus
    type: GRB
    variant: WS2812
    pin: D5
    num_leds: 24
    name: "Neo Ring"
    icon: mdi:led-strip-variant
    effects:
      - random:
          name: "My Slow Random Effect"
          transition_length: 30s
          update_interval: 30s
      - random:
          name: "My Fast Random Effect"
          transition_length: 4s
          update_interval: 5s
      - addressable_twinkle:
      - addressable_twinkle:
          name: Twinkle Effect With Custom Values
          twinkle_probability: 5%
          progress_interval: 4ms
      - addressable_scan:
      - addressable_scan:
          name: Scan Effect With Custom Values
          move_interval: 100ms
          scan_width: 1
      - strobe:
      - strobe:
          name: Strobe Effect With Custom Values
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 90%
              blue: 0%
              duration: 500ms
            - state: false
              duration: 250ms
            - state: true
              brightness: 100%
              red: 0%
              green: 100%
              blue: 0%
              duration: 500ms

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Neo Ring FB"
    password: !secret api_password

captive_portal:

web_server:
  port: 80
  version: 3