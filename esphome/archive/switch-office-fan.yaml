esphome:
  name: "switch-air-filter-bedroom"
  friendly_name: "Bedroom Air Filter Switch"

esp8266:
  board: esp8285
  restore_from_flash: true

# UART configuration for Sonoff D1
uart:
  rx_pin: RX
  tx_pin: TX
  baud_rate: 9600

# Disable logging over UART since it's used by the dimmer
logger:
  baud_rate: 0

# WiFi configuration with power management
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light  # Reduces power consumption
  
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Switch-Air-Filter-C"
    password: "kwyrK7KKY4Ez"

captive_portal:

# Web server (consider disabling in production for security)
web_server:
  port: 80
#  auth:
#   username: !secret web_username
#    password: !secret web_password

# Enable Home Assistant API with encryption
api:
#  encryption:
#    key: !secret api_encryption_key

# OTA updates with authentication
ota:
  - platform: esphome
    password: !secret ota_password

# Status LED (optional - shows connection status)
status_led:
  pin:
    number: GPIO13
    inverted: true

# Main light configuration
light:
  - platform: sonoff_d1
    use_rm433_remote: false
    name: "Bedroom Air Filter"
    id: bedroom_air_filter
    icon: mdi:air-filter
    restore_mode: RESTORE_DEFAULT_OFF
    gamma_correct: 1.0  # Standard gamma correction for better dimming curve
    default_transition_length: 1s
    min_value: 20  # 20% minimum to prevent motor stall
    max_value: 80  # 80% maximum to prevent overheating

# Button entity for manual control (optional)
button:
  - platform: restart
    name: "Restart Bedroom Air Filter Switch"
    id: restart_switch

# Sensors for monitoring (optional but useful)
sensor:
  - platform: wifi_signal
    name: "Bedroom Air Filter WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic
    
  - platform: uptime
    name: "Bedroom Air Filter Uptime"
    entity_category: diagnostic

# Text sensors for device info (optional)
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Bedroom Air Filter IP Address"
      entity_category: diagnostic