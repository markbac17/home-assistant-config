esphome:
  name: "light-china-room"

esp8266:
  board: esp01_1m

# Enable logging
logger:

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    name: "China Room light"
    on_press:
      - switch.toggle: relay

switch:
  - platform: gpio
    name: "China Room light"
    icon: mdi:floor-lamp
    pin: GPIO12
    id: relay

status_led:
  pin:
    number: GPIO13
    inverted: yes

# Enable Home Assistant API
api:
ota:
  - platform: esphome
    password: "a72c25ebb9f91517d551b18126fdd7e9"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Switch-Polonia Fallback Hotspot"
    password: "N0XRXrGhgoNd"

captive_portal:

web_server:
  port: 80